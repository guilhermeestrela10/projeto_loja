{% extends "base.html" %}{% block content %}
<h2>Clientes</h2>
<form method="post"><input name="nome" placeholder="Nome" required>
<input name="email" type="email" placeholder="E-mail" required><button>Cadastrar</button></form>
<table><tr><th>ID</th><th>Nome</th><th>E-mail</th></tr>
{% for c in clientes %}<tr><td>{{ c.id }}</td><td>{{ c.nome }}</td><td>{{ c.email }}</td></tr>{% endfor %}
</table>{% endblock %}
