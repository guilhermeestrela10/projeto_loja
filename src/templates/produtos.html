{% extends "base.html" %}{% block content %}
<h2>Produtos</h2>
<form method="post"><input name="nome" placeholder="Nome" required>
<input name="preco" type="number" step="0.01" min="0" placeholder="Preço" required>
<input name="estoque" type="number" min="0" placeholder="Estoque" required><button>Cadastrar</button></form>
<table><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Estoque</th></tr>
{% for p in produtos %}<tr><td>{{ p.id }}</td><td>{{ p.nome }}</td><td>R$ {{ "%.2f"|format(p.preco) }}</td><td>{{ p.estoque }}</td></tr>{% endfor %}
</table>{% endblock %}
