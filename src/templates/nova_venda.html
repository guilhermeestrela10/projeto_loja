{% extends "base.html" %}{% block content %}
<h2>Nova venda</h2>
<form method="post">
<select name="cliente_id" required>{% for c in clientes %}<option value="{{ c.id }}" {% if request.form.cliente_id == c.id|string %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select>
<select name="produto_id" required>{% for p in produtos %}<option value="{{ p.id }}" {% if request.form.produto_id == p.id|string %}selected{% endif %}>{{ p.nome }} – R$ {{ "%.2f"|format(p.preco) }} (estoque: {{ p.estoque }})</option>{% endfor %}</select>
<input name="quantidade" type="number" min="1" value="{{ request.form.quantidade or 1 }}" required>
<button name="acao" value="calcular">Calcular desconto</button>
<button name="acao" value="confirmar">Confirmar venda</button>
</form>
{% if preview %}<div class="card">Subtotal: R$ {{ "%.2f"|format(preview.subtotal) }}<br>
Desconto: R$ {{ "%.2f"|format(preview.desconto) }}<br><b>Total: R$ {{ "%.2f"|format(preview.total) }}</b></div>{% endif %}
{% endblock %}
